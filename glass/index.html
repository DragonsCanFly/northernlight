<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת הזוהר — זכוכית</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: light, precise, quietly luxurious — a lab instrument made of glass
   IDEA: a holographic Earth floating over a glass plate whose rings are the five filters of the query
   PICTURE: frosted lavender globe with a glowing aurora oval, a beam from the plate's centre, particles spiralling inward
   COLOUR/TYPE: pearl-lavender ground; aurora colours as the only saturated hues (gold, violet, cyan, green, magenta); Assistant
   LAYOUT: object centred, glass cards right (data) and left (question + cities); cards stack on phones */
:root{--ink:#2b2a45;--mut:#6b6a86;--glass:rgba(255,255,255,.38);--edge:rgba(255,255,255,.8)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:Assistant,system-ui,sans-serif;background:#e6e5ef}
canvas{position:fixed;inset:0}
.card{position:fixed;z-index:3;background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:16px 18px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(80,70,140,.15),inset 0 1px 0 rgba(255,255,255,.9)}
#right{top:22px;right:22px;width:300px}
#left{top:22px;left:22px;width:270px}
h1{margin:0;font-size:24px;font-weight:300;letter-spacing:.3px}
.lead{margin:6px 0 12px;font-size:13.5px;color:var(--mut);line-height:1.5}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.7);font-size:13.5px}
.row i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.row b{font-weight:300;font-size:19px;direction:ltr;font-variant-numeric:tabular-nums}
.row small{display:block;color:var(--mut);font-size:11.5px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#chips button{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.35);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
#chips button.on{background:#2b2a45;color:#fff;border-color:#2b2a45}
#hit{margin-top:12px;font-size:12.5px;color:var(--mut)} #hit b{color:var(--ink);font-weight:600;direction:ltr;unicode-bidi:isolate}
#foot{position:fixed;bottom:10px;right:22px;left:22px;font-size:11px;color:var(--mut);z-index:3;text-align:center}
@media (max-width:700px){#left{top:10px;left:10px;right:10px;width:auto;padding:10px 12px}#left .lead{display:none}h1{font-size:19px}
  #right{top:auto;bottom:28px;left:10px;right:10px;width:auto;padding:8px 12px;}#right .rt{display:none}.row{padding:4px 0;font-size:12px}.row b{font-size:15px}.row small{display:none}#foot{font-size:9.5px;bottom:4px}}
</style>
</head>
<body>
<div id="left" class="card"><h1>מערכת הזוהר</h1><p class="lead">האור נכנס בטבעת החיצונית ומסתחרר פנימה. כל טבעת היא תנאי, ורק מה שעובר את כולן עולה בקרן אל כדור הארץ ומדליק זוהר.</p><div id="chips"></div><div id="hit">הגיעו לכדור הארץ: <b id="hits">0</b></div></div>
<div id="right" class="card"><div class="rt" style="font-size:12px;color:var(--mut);margin-bottom:4px">שעות · 2021–2025</div><div id="rows"></div></div>
<div id="foot">רדיוס הטבעות בסקאלת חזקה (n^0.35) · כל חלקיק עובר טבעת בהסתברות האמיתית · Kp — GFZ · עננות — ERA5 · שמש וירח — חישוב</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
{
const D={all:{he:'כל הערים',n:[219120,63772,16934,2441,306]},tromso:{he:'טרומסה',n:[43824,12419,3410,210,27]},abisko:{he:'אביסקו',n:[43824,12578,3456,160,32]},
 rovaniemi:{he:'רובניימי',n:[43824,12726,3508,618,69]},reykjavik:{he:'רייקיאוויק',n:[43824,13026,3579,547,83]},fairbanks:{he:'פיירבנקס',n:[43824,13023,2981,906,95]}};
const ST=[{t:'כל השעות',s:'האור נכנס',c:[240,168,58]},{t:'חושך',s:'השמש מתחת ל‑12°',c:[123,108,255]},{t:'הדלת המגנטית',s:'Kp ≥ 3',c:[63,180,255]},{t:'שמיים בהירים',s:'עננות ≤ 30%',c:[150,160,190]},{t:'סערה',s:'Kp ≥ 5',c:[31,211,154]}];
const fmt=n=>Math.round(n).toLocaleString('en-US');
let key='all',cur=D.all.n.slice(),W,H,mob,S,cx,cy,yaw=0,parts=[],sparkles=[],risers=[],flashes=[],hits=0,land=null;
const chips=document.getElementById('chips'),rows=document.getElementById('rows');
Object.entries(D).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.he;if(k===key)b.className='on';b.onclick=()=>{key=k;hits=0;[...chips.children].forEach(c=>c.classList.toggle('on',c===b));table();};chips.appendChild(b);});
function table(){const n=D[key].n;rows.innerHTML=ST.map((s,i)=>`<div class="row"><i style="color:rgb(${s.c});background:rgb(${s.c})"></i><span>${s.t}<small>${s.s}${i?' · עוברים '+Math.round(100*n[i]/n[i-1])+'%':''}</small></span><b>${fmt(n[i])}</b></div>`).join('');}table();
const RR=i=>Math.max(0.05,1.25*Math.pow(cur[i]/cur[0],0.35));
const SPH={y:1.55,r:0.62},TILT=0.42;
function P(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw);let X=x*c-z*s,Z=x*s+z*c;const cp=Math.cos(0.38),sp=Math.sin(0.38);const Y=y*cp-Z*sp,Z2=y*sp+Z*cp;const k=7/(7+Z2);return [cx+X*S*k,cy-Y*S*k,Z2,k];}
// globe-local point (lat,lon on the sphere, pole tilted toward the viewer)
function G(lat,lon,alt=0){const r=SPH.r*(1+alt),a=lat*Math.PI/180,b=lon*Math.PI/180+millis()/9000;let x=r*Math.cos(a)*Math.cos(b),y=r*Math.sin(a),z=r*Math.cos(a)*Math.sin(b);
  const y2=y*Math.cos(TILT)-z*Math.sin(TILT),z2=y*Math.sin(TILT)+z*Math.cos(TILT);return P(x,SPH.y+y2,z2);}
async function loadLand(){try{window.echarts={registerMap:(n,g)=>{window.__G=g;}};await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});
  const g=window.__G,sc=g.UTF8Scale||1024,rings=[];const dec=(str,o)=>{const out=[];let px=o[0],py=o[1];for(let i=0;i<str.length;i+=2){let x=str.charCodeAt(i)-64,y=str.charCodeAt(i+1)-64;x=(x>>1)^(-(x&1));y=(y>>1)^(-(y&1));x+=px;y+=py;px=x;py=y;out.push([x/sc,y/sc]);}return out;};
  g.features.forEach(f=>{const gm=f.geometry;if(!gm)return;const polys=gm.type==='Polygon'?[gm.coordinates]:gm.coordinates,offs=gm.type==='Polygon'?[gm.encodeOffsets]:gm.encodeOffsets;polys.forEach((p,pi)=>p.forEach((r,ri)=>rings.push(typeof r==='string'?dec(r,offs[pi][ri]):r)));});
  const inR=(x,y,r)=>{let o=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))o=!o;}return o;};
  const bb=rings.map(r=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;r.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]);});return [a,b,c,d];});
  const pts=[];for(let la=-56;la<84;la+=2.4){const st=2.4/Math.max(0.25,Math.cos(la*Math.PI/180));for(let lo=-180;lo<180;lo+=st){let n=0;rings.forEach((r,i)=>{const B=bb[i];if(lo<B[0]||lo>B[1]||la<B[2]||la>B[3])return;if(inR(lo,la,r))n++;});if(n%2)pts.push([la,lo,Math.random()]);}}land=pts;}catch(e){land=null;}}
window.setup=()=>{createCanvas(windowWidth,windowHeight);pixelDensity(Math.min(2,devicePixelRatio||1));lay();loadLand();};
window.windowResized=()=>{resizeCanvas(windowWidth,windowHeight);lay();};
function lay(){W=width;H=height;mob=W<700;S=Math.min(W*(mob?0.3:0.19),H*(mob?0.17:0.2));cx=W/2;cy=H*(mob?0.6:0.66);}
window.draw=()=>{const dt=Math.min(0.05,deltaTime/1000),ctx=drawingContext,n=D[key].n;for(let i=0;i<5;i++)cur[i]+=(n[i]-cur[i])*0.07;yaw+=dt*0.08;
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f1f0f7');g.addColorStop(0.6,'#dedde9');g.addColorStop(1,'#cfcedd');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const v=ctx.createRadialGradient(cx,cy-S,S*0.4,cx,cy-S,Math.max(W,H)*0.7);v.addColorStop(0,'rgba(255,255,255,0.55)');v.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  arc(ctx);plate(ctx);
  // spawn at the outer ring
  for(let k=0;k<Math.round(300*dt+Math.random()*0.5);k++)parts.push({a:Math.random()*6.283,r:RR(0)*1.0,st:0,sp:0.18+Math.random()*0.12});
  ctx.save();for(const p of parts){p.r-=p.sp*dt*(0.6+p.r);p.a+=dt*(0.9/(0.3+p.r));const ni=p.st+1;
    if(ni<5&&p.r<=RR(ni)){if(Math.random()<n[ni]/n[p.st])p.st=ni;else{p.dead=1;sparkles.push({a:p.a,r:p.r,c:ST[ni].c,l:1});}}
    if(p.st===4&&p.r<=0.03){p.dead=1;risers.push({y:0.02,a:p.a});}
    const q=P(Math.cos(p.a)*p.r,0.012,Math.sin(p.a)*p.r),c=ST[p.st].c;ctx.fillStyle=`rgba(${c},0.85)`;ctx.beginPath();ctx.arc(q[0],q[1],(p.st===4?2.4:1.5)*q[3],0,7);ctx.fill();}
  parts=parts.filter(p=>!p.dead);
  for(const s of sparkles){s.l-=dt*0.55;const q=P(Math.cos(s.a)*s.r,0.012+(1-s.l)*0.12,Math.sin(s.a)*s.r);ctx.fillStyle=`rgba(${s.c},${0.55*s.l})`;ctx.beginPath();ctx.arc(q[0],q[1],(1+3*(1-s.l))*q[3],0,7);ctx.fill();}
  sparkles=sparkles.filter(s=>s.l>0);if(sparkles.length>1600)sparkles.splice(0,sparkles.length-1600);ctx.restore();
  beam(ctx,dt);globe(ctx);hitsEl();};
function plate(ctx){const w=1.75,d=1.5,h=0.07;const c=[[-w,-d],[w,-d],[w,d],[-w,d]];
  const top=c.map(([x,z])=>P(x,0,z)),bot=c.map(([x,z])=>P(x,-h,z));
  // edge faces
  ctx.fillStyle='rgba(170,168,200,0.55)';[[0,1],[1,2],[2,3],[3,0]].forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(...top[a]);ctx.lineTo(...top[b]);ctx.lineTo(...bot[b]);ctx.lineTo(...bot[a]);ctx.closePath();ctx.fill();});
  ctx.beginPath();top.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();const g=ctx.createLinearGradient(0,top[0][1],0,top[2][1]);g.addColorStop(0,'rgba(255,255,255,0.55)');g.addColorStop(1,'rgba(225,224,240,0.75)');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=1.4;ctx.stroke();
  // grid etched in the glass
  ctx.strokeStyle='rgba(140,138,180,0.18)';ctx.lineWidth=1;for(let k=-3;k<=3;k++){const a=P(k*w/3.5,0.001,-d),b=P(k*w/3.5,0.001,d);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();const e=P(-w,0.001,k*d/3.5),f=P(w,0.001,k*d/3.5);ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(f[0],f[1]);ctx.stroke();}
  // reflection of the globe
  const rp=P(0,0.001,0),rg=ctx.createRadialGradient(rp[0],rp[1],0,rp[0],rp[1],S*0.9);rg.addColorStop(0,'rgba(190,170,240,0.35)');rg.addColorStop(1,'rgba(190,170,240,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(rp[0],rp[1],S*0.9,S*0.3,0,0,7);ctx.fill();
  // the five rings
  for(let i=0;i<5;i++){const r=RR(i),c=ST[i].c;for(const [lw,al] of [[9,0.16],[3.2,0.55],[1,0.95]]){ctx.beginPath();for(let k=0;k<=120;k++){const t=k/120*6.283;const q=P(Math.cos(t)*r,0.006,Math.sin(t)*r);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}ctx.strokeStyle=al>0.9?'rgba(255,255,255,0.9)':`rgba(${c},${al})`;ctx.lineWidth=lw;ctx.stroke();}}
}
function beam(ctx,dt){const b=P(0,0,0),t=G(-90,0,0.0);const g=ctx.createLinearGradient(b[0],b[1],t[0],t[1]);g.addColorStop(0,'rgba(255,140,210,0.55)');g.addColorStop(0.5,'rgba(190,160,255,0.25)');g.addColorStop(1,'rgba(160,240,220,0.12)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b[0]-6,b[1]);ctx.lineTo(t[0]-S*0.12,t[1]);ctx.lineTo(t[0]+S*0.12,t[1]);ctx.lineTo(b[0]+6,b[1]);ctx.closePath();ctx.fill();
  const gl=ctx.createRadialGradient(b[0],b[1],0,b[0],b[1],26);gl.addColorStop(0,'rgba(255,170,220,0.9)');gl.addColorStop(1,'rgba(255,170,220,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(b[0],b[1],26,0,7);ctx.fill();
  for(const r of risers){r.y+=dt*0.9;const q=P(0,r.y,0);ctx.fillStyle='rgba(255,255,255,0.95)';ctx.shadowColor='rgba(255,120,200,0.9)';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(q[0],q[1],3.2,0,7);ctx.fill();ctx.shadowBlur=0;
    if(r.y>=SPH.y-SPH.r){r.dead=1;hits++;flashes.push({lon:Math.random()*360,l:1});}}risers=risers.filter(r=>!r.dead);}
function arc(ctx){// solar wind arc above (a bow of drifting points)
  const tm=millis()/1000;for(let k=0;k<160;k++){const t=k/160;const ang=Math.PI*(0.12+0.76*t);const R=SPH.r*2.35+0.04*Math.sin(k*1.7+tm);const q=P(Math.cos(ang)*R*1.5,SPH.y+Math.sin(ang)*R*0.9,-0.6);const a=0.35+0.35*Math.sin(k*0.9+tm*2);ctx.fillStyle=`rgba(240,168,58,${a*0.6})`;ctx.fillRect(q[0],q[1],1.8,1.8);}}
function globe(ctx){const c=P(0,SPH.y,0),r=SPH.r*S*c[3];
  // halo
  let g=ctx.createRadialGradient(c[0],c[1],r*0.9,c[0],c[1],r*1.5);g.addColorStop(0,'rgba(170,150,255,0.35)');g.addColorStop(1,'rgba(170,150,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(c[0],c[1],r*1.5,0,7);ctx.fill();
  // van allen belt — the orbit-like ring, behind half
  belt(ctx,false);
  g=ctx.createRadialGradient(c[0]-r*0.35,c[1]-r*0.4,r*0.05,c[0],c[1],r);g.addColorStop(0,'#fbf8ff');g.addColorStop(0.35,'#d9cdf3');g.addColorStop(0.8,'#9a8bd0');g.addColorStop(1,'#6f61aa');ctx.fillStyle=g;ctx.beginPath();ctx.arc(c[0],c[1],r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.2;ctx.stroke();
  // continents as light dots
  if(land){for(const d of land){const q=G(d[0],d[1],0.003);if(q[2]<P(0,SPH.y,0)[2])continue;ctx.fillStyle=d[2]>0.85?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.55)';ctx.fillRect(q[0],q[1],1.4,1.4);}}
  else{for(let la=-60;la<85;la+=8)for(let lo=0;lo<360;lo+=10){const q=G(la,lo,0.003);if(q[2]<P(0,SPH.y,0)[2])continue;ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(q[0],q[1],1.2,1.2);}}
  aurora(ctx,1);aurora(ctx,-1);belt(ctx,true);}
function belt(ctx,front){const zc=P(0,SPH.y,0)[2];ctx.beginPath();let st=true;for(let k=0;k<=140;k++){const t=k/140*6.283;const R=SPH.r*1.75;const x=Math.cos(t)*R,z=Math.sin(t)*R,y=Math.sin(t)*R*0.18;const q=P(x,SPH.y+y,z);if((q[2]>=zc)!==front){st=true;continue;}st?ctx.moveTo(q[0],q[1]):ctx.lineTo(q[0],q[1]);st=false;}
  ctx.strokeStyle='rgba(120,200,255,0.55)';ctx.lineWidth=2.2;ctx.shadowColor='rgba(120,200,255,0.9)';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;}
function aurora(ctx,hemi){const tm=millis()/1000,zc=P(0,SPH.y,0)[2];let boost=0;
  for(let k=0;k<200;k++){const lon=k*1.8;const la=hemi*(66+3*noise(k*0.08,tm*0.3));const b=G(la,lon,0.005);if(b[2]<zc)continue;let a=0.25+0.4*noise(k*0.12,tm*0.6);
    for(const f of flashes){const d=Math.abs(((lon-f.lon+540)%360)-180);if(d<40)a+=f.l*(1-d/40)*1.3;}a=Math.min(1.4,a)*(hemi<0?0.7:1);
    const t=G(la+hemi*(2+7*a),lon,0.07+0.26*a);const g=ctx.createLinearGradient(b[0],b[1],t[0],t[1]);
    g.addColorStop(0,`rgba(224,69,156,${0.55*a})`);g.addColorStop(0.15,`rgba(31,211,154,${0.95*Math.min(1,a)})`);g.addColorStop(0.6,`rgba(40,200,170,${0.45*a})`);g.addColorStop(0.85,`rgba(230,60,110,${0.35*a})`);g.addColorStop(1,'rgba(123,108,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=3.2*b[3];ctx.shadowColor='rgba(31,211,154,0.8)';ctx.shadowBlur=mob?0:8*Math.min(1,a);ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(t[0],t[1]);ctx.stroke();}
  ctx.shadowBlur=0;
  if(hemi>0){for(const f of flashes)f.l-=deltaTime/1000*0.4;flashes=flashes.filter(f=>f.l>0);}}
function hitsEl(){if(frameCount%6===0)document.getElementById('hits').textContent=hits;}
}
</script>
</body>
</html>
