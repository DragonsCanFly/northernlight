  const g=window.__G,sc=g.UTF8Scale||1024,rings=[];const dec=(str,o)=>{const out=[];let px=o[0],py=o[1];for(let i=0;i<str.length;i+=2){let x=str.charCodeAt(i)-64,y=str.charCodeAt(i+1)-64;x=(x>>1)^(-(x&1));y=(y>>1)^(-(y&1));x+=px;y+=py;px=x;py=y;out.push([x/sc,y/sc]);}return out;};
  g.features.forEach(f=>{const gm=f.geometry;if(!gm)return;const polys=gm.type==='Polygon'?[gm.coordinates]:gm.coordinates,offs=gm.type==='Polygon'?[gm.encodeOffsets]:gm.encodeOffsets;polys.forEach((p,pi)=>p.forEach((r,ri)=>rings.push(typeof r==='string'?dec(r,offs[pi][ri]):r)));});
  const bb=rings.map(r=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;r.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]);});return [a,b,c,d];});
  const inR=(x,y,r)=>{let o=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))o=!o;}return o;};
  const pts=[];for(let la=-58;la<84;la+=1.8){const st=1.8/Math.max(0.2,Math.cos(la*Math.PI/180));for(let lo=-180;lo<180;lo+=st){let n=0;rings.forEach((r,i)=>{const B=bb[i];if(lo<B[0]||lo>B[1]||la<B[2]||la>B[3])return;if(inR(lo,la,r))n++;});if(n%2)pts.push([la,lo,Math.random()]);}}land=pts;}catch(e){land=null;}}
window.setup=()=>{createCanvas(windowWidth,windowHeight);pixelDensity(Math.min(2,devicePixelRatio||1));lay();loadLand();for(let i=0;i<500;i++)stars.push([Math.random(),Math.random(),Math.random()]);
  bP.onclick=()=>{playing=!playing;bP.textContent=playing?'❚❚':'▶';};bR.onclick=()=>{t=0;pins=[];PERF.forEach(p=>p.shown=false);playing=true;bP.textContent='❚❚';};};
window.windowResized=()=>{resizeCanvas(windowWidth,windowHeight);lay();};
function lay(){W=width;H=height;mob=W<640;Rg=Math.min(W,H)*(mob?0.27:0.25);cx=W/2;cy=H*0.5;}
function G(lat,lon){const a=lat*Math.PI/180,b=lon*Math.PI/180+yaw,tl=0.45;let x=Math.cos(a)*Math.sin(b),y=Math.sin(a),z=Math.cos(a)*Math.cos(b);const y2=y*Math.cos(tl)-z*Math.sin(tl),z2=y*Math.sin(tl)+z*Math.cos(tl);return [cx+x*Rg,cy-y2*Rg,z2];}
// altitude colour stops (fraction of the maximum column height)
const SEG=[[0,0.07,[255,79,176]],[0.07,0.55,[45,255,170]],[0.55,0.82,[255,64,96]],[0.82,1,[143,123,255]]];
window.draw=()=>{const dt=Math.min(0.05,deltaTime/1000),ctx=drawingContext;if(playing){t+=SPEED*dt;if(t>=ND){t=ND;playing=false;bP.textContent='▶';}}yaw+=dt*0.15;
  ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle=`rgba(170,255,215,${0.08+0.35*s[2]})`;ctx.fillRect(s[0]*W,s[1]*H,1+s[2]*0.8,1+s[2]*0.8);}
  // orbit lines
  ctx.strokeStyle='rgba(90,255,180,0.07)';ctx.lineWidth=1;for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(cx,cy,Rg*(2.2+k*0.35),Rg*(0.8+k*0.22),-0.3+k*0.25,0,7);ctx.stroke();}
  globe(ctx);columns(ctx);hand(ctx);center(ctx);pinsDraw(ctx,dt);};
function globe(ctx){let g=ctx.createRadialGradient(cx,cy,Rg*0.9,cx,cy,Rg*1.25);g.addColorStop(0,'rgba(45,255,170,0.25)');g.addColorStop(1,'rgba(45,255,170,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,Rg*1.25,0,7);ctx.fill();
  g=ctx.createRadialGradient(cx-Rg*0.3,cy-Rg*0.35,Rg*0.1,cx,cy,Rg);g.addColorStop(0,'#0c2a2a');g.addColorStop(1,'#030b0b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,Rg,0,7);ctx.fill();
  ctx.strokeStyle='rgba(90,255,190,0.75)';ctx.lineWidth=1.5;ctx.shadowColor='rgba(45,255,170,0.9)';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
  if(land){for(const d of land){const q=G(d[0],d[1]);if(q[2]<0)continue;ctx.fillStyle=d[2]>0.9?`rgba(190,255,225,${0.5+0.5*q[2]})`:`rgba(80,200,190,${0.18+0.45*q[2]})`;ctx.fillRect(q[0],q[1],1.4,1.4);}}
  else{for(let la=-75;la<=75;la+=7.5)for(let lo=0;lo<360;lo+=7.5){const q=G(la,lo);if(q[2]<0)continue;ctx.fillStyle=`rgba(80,200,190,${0.12+0.3*q[2]})`;ctx.fillRect(q[0],q[1],1.2,1.2);}}}
function ang(d){return -Math.PI/2+d/ND*Math.PI*2;}
function columns(ctx){const R0=Rg*1.06,HM=Rg*(mob?0.62:0.78);ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='butt';const lw=Math.max(1,2*Math.PI*R0/ND*0.9);
  for(let d=0;d<ND;d++){const k=day[d],past=d<=t;const h=Math.pow(k/9,1.15)*HM;if(h<1)continue;const a=ang(d),ca=Math.cos(a),sa=Math.sin(a);
    const m=lv5[ym(d)]||0,bright=past?(0.28+0.6*Math.min(1,m/12)):0.05;
    for(const [f0,f1,c] of SEG){if(h<=f0*HM)break;if(c===SEG[0][2]&&k<6)continue;const r1=R0+f0*HM,r2=R0+Math.min(h,f1*HM);ctx.strokeStyle=`rgba(${c},${bright*(c===SEG[1][2]?1:0.9)})`;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(cx+ca*r1,cy+sa*r1);ctx.lineTo(cx+ca*r2,cy+sa*r2);ctx.stroke();}
    if(past&&k>=5){const r=R0+h+3;ctx.fillStyle=`rgba(230,255,240,${0.5*bright})`;ctx.fillRect(cx+ca*r-0.8,cy+sa*r-0.8,1.6,1.6);}}
  // years
  ctx.globalCompositeOperation='source-over';ctx.font=`${mob?10:12}px Assistant`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let y=2021;y<=2025;y++){const d=(Date.parse(`${y}-01-01T00:00:00Z`)-T0)/864e5,a=ang(d);ctx.strokeStyle='rgba(160,255,215,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(R0-6),cy+Math.sin(a)*(R0-6));ctx.lineTo(cx+Math.cos(a)*(R0+HM+18),cy+Math.sin(a)*(R0+HM+18));ctx.stroke();
    const am=ang(d+182);ctx.fillStyle='rgba(190,255,225,0.7)';ctx.fillText(String(y),cx+Math.cos(am)*(R0+HM+(mob?16:26)),cy+Math.sin(am)*(R0+HM+(mob?16:26)));}
  ctx.restore();}
function hand(ctx){const a=ang(t),R1=Rg*1.02,R2=Rg*(mob?1.75:1.95);const g=ctx.createLinearGradient(cx+Math.cos(a)*R1,cy+Math.sin(a)*R1,cx+Math.cos(a)*R2,cy+Math.sin(a)*R2);g.addColorStop(0,'rgba(220,255,240,0.9)');g.addColorStop(1,'rgba(220,255,240,0)');
  ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R1,cy+Math.sin(a)*R1);ctx.lineTo(cx+Math.cos(a)*R2,cy+Math.sin(a)*R2);ctx.stroke();
  // reveal pins
  for(const p of PERF){if(!p.shown&&p.d<=t){p.shown=true;pins.push({p,l:1});}}}
function pinsDraw(ctx,dt){const R0=Rg*1.06,HM=Rg*(mob?0.62:0.78);ctx.textBaseline='middle';
  for(const p of PERF){if(!p.shown)continue;const a=ang(p.d),h=Math.pow(day[p.d]/9,1.15)*HM,r=R0+h+10;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.strokeStyle='rgba(230,255,240,0.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.stroke();ctx.fillStyle='rgba(45,255,170,0.9)';ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();}
  for(const q of pins){q.l-=dt*0.28;const a=ang(q.p.d),h=Math.pow(day[q.p.d]/9,1.15)*HM,r=R0+h+16;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    const g=ctx.createRadialGradient(x,y,0,x,y,40);g.addColorStop(0,`rgba(45,255,170,${0.6*q.l})`);g.addColorStop(1,'rgba(45,255,170,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,40,0,7);ctx.fill();
    const c=A.cities[q.p.ci],ds=q.p.iso.slice(0,10).split('-').reverse().join('.');ctx.direction='rtl';ctx.font=`600 ${mob?11:13}px Assistant`;ctx.textAlign=Math.cos(a)>0?'left':'right';ctx.fillStyle=`rgba(235,255,245,${Math.min(1,q.l*1.5)})`;
    const lx=x+Math.cos(a)*14;ctx.fillText(`${c.he} · ${I(ds)} · ${I('Kp '+q.p.kp.toFixed(1))}`,lx,y+Math.sin(a)*14);}
  pins=pins.filter(q=>q.l>0);}
function center(ctx){const d=Math.min(ND-1,Math.floor(t)),ds=new Date(T0+d*864e5).toISOString().slice(0,10).split('-').reverse().join('.');ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(225,255,240,0.92)';ctx.font=`300 ${mob?26:Math.round(Rg*0.2)}px Assistant`;ctx.fillText(I(ds),cx,cy-Rg*0.05);
  ctx.fillStyle='rgba(45,255,170,0.95)';ctx.font=`${mob?13:16}px Assistant`;ctx.fillText(I('Kp '+day[d].toFixed(1)),cx,cy+Rg*0.13);
  ctx.fillStyle='rgba(160,220,200,0.75)';ctx.font=`${mob?11:12.5}px Assistant`;ctx.direction='rtl';ctx.fillText(`רגעי שלמות עד עכשיו: ${I(String(PERF.filter(p=>p.shown).length))}`,cx,cy+Rg*0.28);}
}
</script>
